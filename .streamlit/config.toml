orangeTextColor = "#93370D"
yellowColor = "#A16207"
greenColor = "#1A7F37"
greenBackgroundColor = "#DCFAE6"
greenTextColor = "#067647"
blueColor = "#0B4F6C"
blueBackgroundColor = "#E0F2FE"
blueTextColor = "#0B4F6C"
violetColor = "#6B4FA1"
grayColor = "#5B6B73"
grayBackgroundColor = "#EAE7DB"
grayTextColor = "#3E4C54"
chartCategoricalColors = ["#1A7F37", "#B42318", "#5B6B73", "#0B4F6C", "#B7791F", "#6B4FA1", "#2C7A7B"]

[theme.light.sidebar]
