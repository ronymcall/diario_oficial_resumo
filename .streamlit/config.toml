# Identidade visual: Prefeitura Municipal de São Cristóvão/SE + layout Fintech Bento
# Paleta institucional baseada em saocristovao.se.gov.br (Azul Marinho #111C5A / #172554 e Azul Real #1E3A8A / #2563EB)

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseFontSize = 14
baseFontWeight = 400
codeFontSize = "0.85rem"
baseRadius = "12px"
buttonRadius = "10px"
showWidgetBorder = true
showSidebarBorder = false
paddingTop = "1rem"
paddingBottom = "2.5rem"
headingFontSizes = ["1.75rem", "1.35rem", "1.125rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2.125rem"
metricValueFontWeight = 700
linkUnderline = false

[theme.sidebar]
paddingTop = "0.75rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#1E3A8A"
backgroundColor = "#FFFFFF"
