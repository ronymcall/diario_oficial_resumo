[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "'Source Serif 4':https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
baseRadius = "8px"
buttonRadius = "8px"
showWidgetBorder = true
showSidebarBorder = true
paddingTop = "1.5rem"
paddingBottom = "2.5rem"
headingFontSizes = ["2rem", "1.5rem", "1.2rem", "1.05rem", "0.95rem", "0.85rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
metricValueFontSize = "2rem"
metricValueFontWeight = 700
linkUnderline = false

[theme.sidebar]
paddingTop = "1rem"
paddingBottom = "1.5rem"

[theme.light]
primaryColor = "#0B4F6C"
backgroundColor = "#FCFBF7"
secondaryBackgroundColor = "#F3F1E9"
textColor = "#1C2B33"
borderColor = "#DFDCD0"
linkColor = "#0B4F6C"
codeBackgroundColor = "#EFEDE4"
codeTextColor = "#1C2B33"
dataframeBorderColor = "#DFDCD0"
dataframeHeaderBackgroundColor = "#EAE7DB"
dataframeHeaderTextColor = "#1C2B33"
redColor = "#B42318"
redBackgroundColor = "#FEE4E2"
redTextColor = "#912018"
orangeColor = "#B54708"
